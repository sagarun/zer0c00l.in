---
# Defaults for certbot role
certbot_domain: zer0c00l.in
certbot_email: "admin@{{ certbot_domain }}"
 # Add additional names (e.g. www domain) if desired
certbot_server_aliases: []

# Set true to test against Let's Encrypt staging environment
certbot_staging: false

# Whether to enable automatic HTTP->HTTPS redirect (certbot --redirect)
certbot_redirect: false

# Systemd timer unit that schedules `certbot renew`.
# Renamed from `certbot.timer` to `certbot-renew.timer` in certbot-4.2.0-1.el10_2.
certbot_renew_timer: certbot-renew.timer
