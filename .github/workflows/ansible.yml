name: Ansible Playbook CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allows manual triggering from GitHub UI

jobs:
  validate:
    name: Validate Ansible Playbook
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install Ansible and dependencies
      run: |
        pip install ansible
        pip install ansible-lint
        ansible-galaxy collection install -r ansible/collections/requirements.yml
    
    - name: Validate Ansible syntax
      run: |
        cd ansible
        ansible-playbook --syntax-check -i inventory.ini site.yml
    
    - name: Lint Ansible playbook
      run: |
        cd ansible
        ansible-lint site.yml || true  # Continue even if linting finds issues
    
    - name: Validate inventory
      run: |
        cd ansible
        ansible-inventory -i inventory.ini --list

  dry-run:
    name: Ansible Dry-Run (Check Mode)
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install Ansible and dependencies
      run: |
        pip install ansible
        ansible-galaxy collection install -r ansible/collections/requirements.yml
    
    - name: Setup SSH key
      if: github.event_name == 'workflow_dispatch'
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
    
    - name: Run Ansible playbook in check mode
      env:
        ANSIBLE_HOST_KEY_CHECKING: False
      run: |
        cd ansible
        if [ -n "${{ secrets.VAULT_PASSWORD }}" ]; then
          echo "${{ secrets.VAULT_PASSWORD }}" > .vault_pass_tmp
          ansible-playbook -i inventory.ini site.yml \
            --vault-password-file .vault_pass_tmp \
            --check \
            --diff
          rm -f .vault_pass_tmp
        else
          echo "Warning: VAULT_PASSWORD secret not set. Skipping vault-encrypted tasks."
          ansible-playbook -i inventory.ini site.yml \
            --check \
            --diff \
            --skip-tags vault
        fi

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: production  # Requires manual approval if configured
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install Ansible and dependencies
      run: |
        pip install ansible
        ansible-galaxy collection install -r ansible/collections/requirements.yml
    
    - name: Setup SSH key
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
    
    - name: Deploy with Ansible
      env:
        ANSIBLE_HOST_KEY_CHECKING: False
      run: |
        cd ansible
        echo "${{ secrets.VAULT_PASSWORD }}" > .vault_pass_tmp
        ansible-playbook -i inventory.ini site.yml \
          --vault-password-file .vault_pass_tmp
        rm -f .vault_pass_tmp
    
    - name: Verify deployment
      run: |
        cd ansible
        echo "${{ secrets.VAULT_PASSWORD }}" > .vault_pass_tmp
        ansible-playbook -i inventory.ini site.yml \
          --vault-password-file .vault_pass_tmp \
          --tags validate
        rm -f .vault_pass_tmp
